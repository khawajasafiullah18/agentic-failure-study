name: deploy

# Publish two things to agentic.theaiplusplus.com:
#
#   1. the analysis application — a FastAPI service that runs the multi-agent
#      engine, deployed as a release tarball and restarted behind a health check;
#   2. the written report — the static explorer, which now lives at /report/.
#
# Two keys, two capabilities. The static key is confined to the webroot by
# rrsync. The service key is confined to a single forced-command script that can
# unpack a tarball into /opt/agentic and restart one systemd unit. Neither key
# can open a shell, and neither can write outside its own target, so the other
# thirty-odd sites on that host stay untouched whatever happens here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-agentic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish credentials
        run: |
          # The corpus quotes public bug reports, and people paste their own API
          # keys into those. GitHub push protection caught this once already, so
          # the build fails here rather than letting a key reach the live host.
          if grep -rInEo 'sk-[A-Za-z0-9_-]{20,}|(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}' \
               index.html service/src service/configs 2>/dev/null; then
            echo "::error::credential-shaped string found in a deployed file"
            exit 1
          fi
          echo "no credentials detected"

      - name: Verify the report is intact
        run: |
          test -s index.html
          grep -q 'Failures in Agentic AI' index.html
          grep -q 'id="payload"' index.html
          records=$(grep -o '"i":' index.html | wc -l)
          echo "records embedded: $records"
          test "$records" -eq 3089

      - name: Verify the service bundle is complete
        run: |
          set -euo pipefail
          test -f service/src/afs/server.py
          test -f service/src/afs/agents.py
          test -f service/src/afs/static/index.html
          test -f service/configs/research_questions.yaml
          test -f service/data/processed/records_enriched.jsonl
          lines=$(wc -l < service/data/processed/records_enriched.jsonl)
          echo "analysis records: $lines"
          test "$lines" -eq 3089
          python3 - <<'PY'
          import ast
          import pathlib
          for path in pathlib.Path("service/src/afs").glob("*.py"):
              ast.parse(path.read_text())
          print("service sources parse")
          PY

  report:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agentic.theaiplusplus.com/report/
    steps:
      - uses: actions/checkout@v4

      - name: Install static key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AGENTIC_SSH_KEY }}" > ~/.ssh/agentic
          chmod 600 ~/.ssh/agentic
          ssh-keyscan -p 22 -H "${{ secrets.AGENTIC_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Sync the report to the webroot
        run: |
          rsync -rlptz --delete --chmod=D755,F644 \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'preview_*.png' --exclude 'service' \
            -e "ssh -i ~/.ssh/agentic -o IdentitiesOnly=yes" \
            ./ "${{ secrets.AGENTIC_USER }}@${{ secrets.AGENTIC_HOST }}:/"

  service:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agentic.theaiplusplus.com/
    steps:
      - uses: actions/checkout@v4

      - name: Install service key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AGENTIC_APP_KEY }}" > ~/.ssh/agentic-app
          chmod 600 ~/.ssh/agentic-app
          ssh-keyscan -p 22 -H "${{ secrets.AGENTIC_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Ship the release
        run: |
          set -euo pipefail
          tar -czf /tmp/service.tar.gz -C service .
          ls -lh /tmp/service.tar.gz
          out=$(ssh -i ~/.ssh/agentic-app -o IdentitiesOnly=yes -o BatchMode=yes \
                 "agentic@${{ secrets.AGENTIC_HOST }}" < /tmp/service.tar.gz)
          echo "$out"
          grep -q '^deployed ' <<< "$out"

  verify:
    needs: [report, service]
    runs-on: ubuntu-latest
    steps:
      - name: Probe the application
        run: |
          set -euo pipefail
          base=https://agentic.theaiplusplus.com
          body=""
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 20 "$base/api/health" || true)
            if grep -q '"status":"ok"' <<< "$body"; then
              echo "$body"
              break
            fi
            echo "attempt $i: not healthy yet"
            sleep 5
            test "$i" -lt 12
          done
          grep -q '"records":3089' <<< "$body"

      - name: Ask the engine a question
        run: |
          set -euo pipefail
          curl -s --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the distribution of failure types?"}' \
            https://agentic.theaiplusplus.com/api/ask -o /tmp/answer.json
          python3 - <<'PY'
          import json
          run = json.load(open("/tmp/answer.json"))
          finding = run["findings"][0]
          assert finding["decision"] in ("accept", "revise"), finding["decision"]
          assert finding["table"], "empty result table"
          assert run["summary"]["verified"] >= 1
          print("answered", finding["rq"], "with", len(finding["table"]),
                "rows; decision", finding["decision"])
          PY

      - name: Probe the report
        run: |
          set -euo pipefail
          curl -s --max-time 30 https://agentic.theaiplusplus.com/report/ -o /tmp/report.html
          grep -q 'Failures in Agentic AI' /tmp/report.html
          csv=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                https://agentic.theaiplusplus.com/report/data/failures.csv)
          test "$csv" = "200"
          redirect=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                     http://agentic.theaiplusplus.com/)
          test "$redirect" = "301"
          echo "report and redirect ok"
